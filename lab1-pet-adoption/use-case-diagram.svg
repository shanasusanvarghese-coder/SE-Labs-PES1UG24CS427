<text x="75" y="270" font-family="Arial, sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle">applicant</text>

<circle cx="600" cy="537" r="8" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>
<line x1="600" y1="545" x2="600" y2="569" stroke="#2C2C2A" stroke-width="1.5"/>
